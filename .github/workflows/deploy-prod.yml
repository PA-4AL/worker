# =============================================================================
# Mise en production — worker
#
# Le worker n'a pas d'ingress public (consommateur Pub/Sub) : la vérification
# porte sur l'état de la révision Cloud Run et sur l'absence de messages en
# souffrance, pas sur un appel HTTP externe.
# =============================================================================
name: Deploy prod

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag de l'image à déployer (ex. sha-a1b2c3d, ou latest)"
        type: string
        default: latest

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-prod-worker
  cancel-in-progress: false

jobs:
  deploy:
    name: Déploiement Cloud Run
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Authentification GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SA_DEPLOY }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Vérification de l'existence de l'image
        run: |
          IMAGE="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/pa/worker:${{ inputs.image_tag }}"
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV
          gcloud artifacts docker images describe "$IMAGE" --format='value(image_summary.digest)'

      - name: Révision précédente (pour un éventuel retour arrière)
        run: |
          PREV=$(gcloud run services describe pa-prod-worker \
            --region ${{ vars.GCP_REGION }} \
            --format='value(status.traffic[0].revisionName)')
          echo "Révision actuellement en trafic : $PREV"
          echo "PREV_REVISION=$PREV" >> $GITHUB_ENV

      - name: Déploiement
        run: |
          gcloud run deploy pa-prod-worker \
            --image "$IMAGE" \
            --region ${{ vars.GCP_REGION }} \
            --quiet

      - name: Vérification de la révision
        run: |
          # Une révision prête = le conteneur écoute sur $PORT (sonde health) et
          # n'a pas planté au démarrage (échec d'authentification Pub/Sub, etc.).
          # Filtre exact via jq : `--filter type:Ready` de gcloud matche aussi
          # RoutesReady et ConfigurationsReady, et renvoie « True;True;True ».
          READY=$(gcloud run services describe pa-prod-worker \
            --region ${{ vars.GCP_REGION }} --format=json \
            | jq -r '[.status.conditions[] | select(.type == "Ready") | .status] | first')
          echo "Condition Ready : $READY"
          if [ "$READY" != "True" ]; then
            echo "::error::Révision non prête — consulter les logs : gcloud run services logs read pa-prod-worker --region ${{ vars.GCP_REGION }}"
            exit 1
          fi

      - name: Récapitulatif
        if: always()
        run: |
          echo "### Déploiement worker" >> $GITHUB_STEP_SUMMARY
          echo "- image : \`$IMAGE\`" >> $GITHUB_STEP_SUMMARY
          echo "- révision précédente : \`$PREV_REVISION\`" >> $GITHUB_STEP_SUMMARY
          echo "- retour arrière : \`gcloud run services update-traffic pa-prod-worker --region ${{ vars.GCP_REGION }} --to-revisions $PREV_REVISION=100\`" >> $GITHUB_STEP_SUMMARY
